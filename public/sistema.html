<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surchérie · Sistema de gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: pestañas de módulo arriba, lista a la izquierda, documento editable (la hoja misma) a la derecha. */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --ink:#1d2433; --muted:#667085; --line:#d9dde4;
  --accent:#e2602f; --accent-ink:#ffffff; --navy:#24304a;
  --ok:#1f7a4d; --ok-bg:#e3f4ea; --warn:#9a5b00; --warn-bg:#fdf0d8; --bad:#b42318; --rev:#3b5bdb; --rev-bg:#e8edff;
  --ui:"IBM Plex Sans", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141821; --panel:#1c2230; --ink:#e7eaf0; --muted:#98a2b3; --line:#2e3646;
  --accent:#f07a4b; --navy:#2b3956; --ok:#6fd3a0; --ok-bg:#16352a; --warn:#f3c26b; --warn-bg:#3a2d12; --bad:#ff8a80; --rev:#9db2ff; --rev-bg:#1f2747;
  color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#141821; --panel:#1c2230; --ink:#e7eaf0; --muted:#98a2b3; --line:#2e3646;
  --accent:#f07a4b; --navy:#2b3956; --ok:#6fd3a0; --ok-bg:#16352a; --warn:#f3c26b; --warn-bg:#3a2d12; --bad:#ff8a80; --rev:#9db2ff; --rev-bg:#1f2747;
  color-scheme: dark; }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--ui);display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:16px;margin:0;font-weight:600}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:10px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:7px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--navy);color:#fff}
.stats{display:flex;gap:6px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat{padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12.5px}
.stat b{font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:8px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.small{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

.wrap{display:grid;grid-template-columns:320px 1fr;flex:1;min-height:0}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.side{max-height:45vh}}
.side{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.filters{display:flex;flex-direction:column;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.filters input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:6px 4px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.list{overflow:auto;flex:1;min-height:0}
.month{position:sticky;top:0;background:var(--panel);padding:8px 12px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);z-index:1}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--bg);border-left-color:var(--accent)}
.item .n{font-weight:600;font-variant-numeric:tabular-nums}
.item .p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{grid-column:2 / 4;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .f{grid-row:2;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:4px;align-items:start;justify-content:flex-end;flex-wrap:wrap}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.rev{background:var(--rev-bg);color:var(--rev)}
.tabs .bdg{display:inline-block;min-width:18px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:17px;text-align:center}
.al-card{display:flex;align-items:center;gap:10px}
.al-n{font-size:22px;font-weight:600;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.al-n.bad{color:var(--bad)} .al-n.warn{color:var(--warn)} .al-n.rev{color:var(--rev)} .al-n.ok{color:var(--ok)}
.tbl tr[data-go]{cursor:pointer} .tbl tr[data-go]:hover td{background:var(--bg)}
.chip.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.chip.bad{background:#fde4e1;color:var(--bad)}
/* ---- Inicio y Calidad (tarjetas) ---- */
@media (max-width:700px){.tabs{overflow-x:auto;max-width:100%;scrollbar-width:none}.tabs button{flex:none}.top{flex-wrap:wrap}}
.wrap.full{grid-template-columns:1fr}.wrap.full .side{display:none}
.hoy{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:2px 2px 0}
.hero h2{font-size:26px;margin:0;font-weight:600;letter-spacing:-.01em}.hero p{margin:3px 0 0;color:var(--muted)}
.quien{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.quien select,.grp0 select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.grp0{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.04);border-top:4px solid var(--line)}
.kpi:hover{border-color:var(--accent)}
.kpi .v{font-size:32px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px;margin-top:2px}.kpi .s{font-size:12.5px;margin-top:8px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.kpi.ok{border-top-color:var(--ok)}.kpi.ok .v{color:var(--ok)}.kpi.warn{border-top-color:#e8a200}.kpi.warn .v{color:var(--warn)}.kpi.bad{border-top-color:var(--bad)}.kpi.bad .v{color:var(--bad)}
.cols{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:14px;align-items:start}
.colA,.colB{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:1050px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h3{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h4{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 2px;font-weight:500}
.hint{color:var(--muted);font-size:12.5px;font-weight:400}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal .dow{font-size:11px;color:var(--muted);text-transform:uppercase;padding:6px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.cal .d{min-height:96px;padding:5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal .d:nth-child(7n){border-right:0}
.cal .d.out{background:var(--bg)}.cal .d.out .num{opacity:.45}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .num{font-size:12px;font-weight:600;align-self:flex-start;padding:1px 6px;border-radius:999px}
.cal .d.today .num{background:var(--accent);color:#fff}
.cx{display:block;width:100%;font:inherit;font-size:11.5px;line-height:1.3;padding:3px 6px;border-radius:6px;border:0;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--rev-bg);color:var(--rev)}
.cx.ok{background:var(--ok-bg);color:var(--ok)}.cx.warn{background:var(--warn-bg);color:var(--warn)}.cx.fut{background:var(--navy);color:#fff}
.mas{border:0;background:none;color:var(--muted);font-size:11.5px;text-align:left;padding:0 4px;cursor:pointer}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:10px 0 0}.leyenda .cx{width:auto;cursor:default}
.diadet{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
@media (max-width:640px){.cal .d{min-height:54px;padding:3px}.cx{font-size:0;height:8px;padding:0;border-radius:4px}.leyenda .cx{font-size:11.5px;height:auto;padding:3px 6px}.cal .dow{padding:4px;font-size:10px}}
.cxrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.cxrow[data-go]{cursor:pointer}.cxrow[data-go]:hover .t b{color:var(--accent)}.cxrow:last-child{border-bottom:0}
.dia{display:flex;flex-direction:column;align-items:center;border-radius:10px;background:var(--bg);padding:4px 0}
.dia b{font-size:18px;line-height:1.1}.dia span{font-size:11px;color:var(--muted);text-transform:uppercase}
.cxrow .t,.task .t,.frow .t{min-width:0;display:flex;flex-direction:column}
.cxrow .t b,.task .t b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cxrow .t span,.task .t span,.frow .t span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);width:100%}
.task:last-child{border-bottom:0}.task .t{flex:1}.task .acc{display:flex;gap:6px;flex:none}
.linkrow{background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);text-align:left;font:inherit;cursor:pointer}.linkrow:hover b{color:var(--accent)}
.cnt{font-weight:600;font-variant-numeric:tabular-nums;background:var(--bg);border-radius:999px;padding:1px 9px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line);display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:#e8a200}.dot.bad{background:var(--bad)}.dot.rev{background:var(--rev)}.dot.mute{background:var(--line)}
.frow{display:grid;grid-template-columns:auto 70px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.frow:last-child{border-bottom:0}.frow input{width:18px;height:18px}.frow .fecha{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.bloque{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px;font-weight:500}.bloque:first-child{margin-top:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:12px;background:var(--panel);color:var(--ink);font:inherit;min-height:104px}
.tile:hover{border-color:var(--accent)}.tile.warn{border-left-color:#e8a200}.tile.bad{border-left-color:var(--bad)}.tile.rev{border-left-color:var(--rev)}
.tile .tc{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}.tile b{font-weight:500;line-height:1.25}
.tile .te{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:auto}.tile .tn{font-size:12px;color:var(--muted)}

.paper.pl{font-size:10.5px}.paper.pl td{height:19px}
.paper select{width:100%}.paper textarea{min-height:48px}

.main{overflow:auto;padding:16px;min-height:0}
.bar{max-width:820px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.bar .txt{color:var(--muted)}
.bar .txt b{color:var(--ink);font-weight:500}
.links{display:flex;gap:6px;flex-wrap:wrap}
.note{max-width:820px;margin:0 auto 12px;padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.note.err{color:var(--bad)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.revbox{max-width:820px;margin:0 auto 12px;padding:10px 12px;border-radius:8px;border:1px solid var(--rev);background:var(--rev-bg);color:var(--ink);font-size:13px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.revbox b{color:var(--rev)}
.panel{max-width:820px;margin:0 auto 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h2{font-size:15px;margin:0 0 4px}
.panel p{margin:0 0 10px;color:var(--muted);font-size:13px}
.pick{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.pick label{display:grid;grid-template-columns:auto 70px 1fr auto;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}
.pick label:last-child{border-bottom:0}
.pick .m{color:var(--muted);font-size:12px}
.grp{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.paperwrap{overflow-x:auto}
.empty{max-width:520px;margin:60px auto;text-align:center;color:var(--muted)}
.hint{color:var(--muted);font-size:12px}

/* ---------- Hojas (siempre blancas, como impresas) ---------- */
.paper{width:794px;margin:0 auto;background:#fff;color:#111;padding:26px 27px;font:12.5px/1.25 Roboto, Arial, sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.paper table{width:100%;border-collapse:collapse;table-layout:fixed}
.paper td{border:1px solid #c9c9c9;padding:2px 4px;height:21px;vertical-align:middle;overflow:hidden;white-space:nowrap}
.paper .thick td{border-top:2px solid #111}
.paper .b{font-weight:700}
.paper .c{text-align:center}
.paper .r{text-align:right}
.paper .peach{background:#fbe3d2;font-weight:700}
.paper .hdr td{height:70px}
.paper .hdr img{height:52px;display:block;margin:0 auto}
.paper .tit{font-weight:700;text-align:center;font-size:13px;white-space:normal}
.paper .form{text-align:center;font-size:13px;white-space:normal}
.paper .gap td{border-left:0;border-right:0;height:8px;padding:0}
.paper .tall td{height:230px;vertical-align:top}
.paper .mid td{height:110px;vertical-align:top}
.paper .obs td{height:42px;vertical-align:top;white-space:normal}
.paper .wrapc{white-space:normal;line-height:1.25;padding-top:3px;padding-bottom:3px}
.paper .foot td{height:34px;white-space:normal;font-size:11.5px}
.paper .small{font-size:11px;color:#333}
.paper .leg{font-size:10.5px;white-space:normal;color:#333;height:auto;padding:6px 4px}
.paper input,.paper textarea,.paper select{width:100%;border:0;background:transparent;font:inherit;color:inherit;padding:0;margin:0;outline:none;border-bottom:1px dashed transparent}
.paper select{appearance:none;cursor:pointer}
.paper textarea{resize:none;height:100%;min-height:36px}
.paper input:hover,.paper textarea:hover,.paper select:hover{border-bottom-color:#e2a07f}
.paper input:focus,.paper textarea:focus,.paper select:focus{border-bottom-color:#e2602f;background:#fff7f2}
.paper input.c{text-align:center}
.paper input.r{text-align:right}
.paper input.miss{color:#b42318}
.paper .ph::placeholder{color:#bbb}
.paper.carta{width:816px;min-height:1056px;padding:46px 58px 40px;font:11px/1.2 Roboto, Arial, sans-serif}
.carta table{border-top:4px solid #1d2c7c;border-bottom:4px solid #1d2c7c}
.carta td{border:1px solid #dadada;height:18px;padding:1px 4px}
.carta .k td{border-color:#9a9a9a}
.carta .thick td{border-top:1.5px solid #111}
.carta .hdr td{height:48px;border-color:#111}
.carta .hdr img{height:38px}
.carta .tit{font-size:9.5px;white-space:nowrap;letter-spacing:-.1px}
.carta .form{font-size:11px}
.carta .gap td{height:5px;border-left:0;border-right:0}
.carta .pr td{height:15.5px}
.carta .pr td:first-child{border-right-color:#dadada}
.carta .peach td{background:#fce5d4;height:17px;border-color:#111}
.carta .ds td{height:16px}
.carta .ob td:first-child{font-size:10px}
.carta .ob td{height:18px;border-top:1px solid #111;border-bottom:1px solid #111;white-space:normal}
.carta .sg td{height:16.4px;border-color:#e3e3e3}
.carta .foot td{height:20px;border-color:#111;font-size:10px}
.carta .foot .ev{font-size:9px;line-height:1.35}
.paper .del{border:0;background:none;color:#b42318;cursor:pointer;font-size:13px;padding:0 2px}
#offscreen{position:fixed;left:-12000px;top:0;width:794px}
#print{display:none}
@media print{
  html,body{background:#fff!important;display:block!important;height:auto!important}
  body>*:not(#print){display:none!important}
  #print{display:block!important}
  #print .pg{break-after:page;page-break-after:always}
  #print .pg:last-child{break-after:auto;page-break-after:auto}
  #print .paper{box-shadow:none!important;margin:0!important}
  #print .carta{box-sizing:border-box;height:1054px;min-height:0;overflow:hidden}
  #print .pg{overflow:hidden}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl input,.tbl select{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)} .warn-t{color:var(--warn)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}.prog>div{height:100%;background:var(--accent);width:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ---- línea ejecutiva ---- */
:root{--accent:#1f4e8c;--navy:#0f2340;--brand:#0f2340}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --accent:#7aa7e6; --navy:#0b1a30; } }
:root[data-theme="dark"]{--accent:#7aa7e6;--navy:#0b1a30}
body{font-variant-numeric:tabular-nums}
.top{background:var(--brand);border-bottom:0;padding:8px 18px;gap:10px 22px;justify-content:flex-start}
.brand{display:flex;align-items:center;gap:10px;color:#fff;margin-right:8px}
.brand .mark{width:30px;height:30px;border-radius:7px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:16px}
.brand b{display:block;font-size:15px;font-weight:600;letter-spacing:.01em;line-height:1.1}.brand span{display:block;font-size:11.5px;color:#b8c4d9}
.top .tabs{background:transparent;border:0;padding:0;gap:2px}
.top .tabs button{color:#c9d3e4;padding:8px 12px;border-radius:6px;font-weight:500}
.top .tabs button:hover{color:#fff;background:rgba(255,255,255,.07)}
.top .tabs button[aria-selected="true"]{background:#fff;color:var(--brand)}
.tabs .bdg{background:#c0392b}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:8px 18px;background:var(--panel);border-bottom:1px solid var(--line);min-height:48px}
.btn{border-radius:6px}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:#1b3a63;border-color:#1b3a63}
.item[aria-current="true"]{border-left-color:var(--navy)}
.seg button[aria-pressed="true"]{background:var(--navy)}
.hero h2{font-size:22px;font-weight:600;letter-spacing:0}
.resumen{display:flex;gap:14px;align-items:baseline;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:8px;padding:12px 16px}
.resumen .rt{font-size:11.5px;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.resumen p{margin:0;font-size:14.5px;line-height:1.5}
@media (max-width:640px){.resumen{flex-direction:column;gap:4px}}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border-radius:8px;border-top:0;border-left:4px solid var(--line);padding:12px 14px;box-shadow:none}
.kpi .l{order:0;margin:0;font-size:12px;font-weight:500;color:var(--muted)}
.kpi .v{font-size:28px;margin-top:4px;color:var(--ink)}
.kpi.ok{border-left-color:var(--ok)}.kpi.warn{border-left-color:#d4930b}.kpi.bad{border-left-color:var(--bad)}
.kpi.ok .v,.kpi.warn .v{color:var(--ink)}.kpi.bad .v{color:var(--bad)}
.kpi .s{color:var(--muted);margin-top:6px}
.kbar{display:block;width:100%;height:5px;border-radius:3px;background:var(--bg);margin-top:8px;overflow:hidden}
.kbar i{display:block;height:100%;background:var(--navy)}
.kpi.ok .kbar i{background:var(--ok)}.kpi.warn .kbar i{background:#d4930b}.kpi.bad .kbar i{background:var(--bad)}
.card{border-radius:8px;box-shadow:none}
.card h3{font-size:14px;font-weight:600}
.cal{border-radius:6px}
.cal .d.today .num{background:var(--navy)}
.cal .d.sel{box-shadow:inset 0 0 0 2px var(--navy)}
.cx{border-radius:4px;border-left:3px solid currentColor;background:var(--rev-bg)}
.cx.fut{background:#e8edf5;color:var(--navy)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .cx.fut{background:#1d2a40;color:#c9d6ec} }
:root[data-theme="dark"] .cx.fut{background:#1d2a40;color:#c9d6ec}
.dia{border-radius:6px}
.tile{border-radius:8px}
.chip{border-radius:4px;font-weight:500}

/* ---- menú lateral ---- */
body{display:grid;grid-template-columns:var(--sbw,240px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%}
body.colap{--sbw:68px}
.top{grid-column:1;grid-row:1 / 3;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;flex-wrap:nowrap;gap:0;padding:0;overflow-y:auto;overflow-x:hidden;min-height:0}
.brand{padding:16px 16px 14px;margin:0;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .mark{flex:none}
.top .tabs{flex-direction:column;gap:2px;padding:10px 10px;flex:1}
.nsec{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#7f90ad;padding:14px 10px 6px}
.nsec:first-child{padding-top:4px}
.top .tabs button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 10px;border-radius:6px;color:#c9d3e4;font-size:13.5px;white-space:nowrap}
.top .tabs button svg,.colapsar svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top .tabs button[aria-selected="true"]{background:#1f4e8c;color:#fff}
.top .tabs button .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.tabs .bdg{margin-left:auto}
.sbfoot{border-top:1px solid rgba(255,255,255,.08);padding:10px}
.sbuser{display:flex;align-items:center;gap:10px;padding:6px 6px 10px;color:#fff;min-width:0}
.sbuser .av{width:32px;height:32px;border-radius:50%;background:#1f4e8c;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.sbuser .lbl{min-width:0}.sbuser b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sbuser .lbl span{display:block;font-size:11.5px;color:#9fb0cc}
.colapsar{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:#9fb0cc;padding:8px 10px;border-radius:6px;font-size:13px}
.colapsar:hover{color:#fff;background:rgba(255,255,255,.07)}
body.colap .lbl,body.colap .nsec{display:none}
body.colap .brand{justify-content:center;padding:16px 0 14px}
body.colap .top .tabs button,body.colap .colapsar{justify-content:center;padding:10px 0;position:relative}
body.colap .colapsar svg{transform:rotate(180deg)}
body.colap .tabs .bdg{position:absolute;top:2px;right:6px;margin:0;min-width:16px;font-size:10px;line-height:15px}
body.colap .sbuser{justify-content:center;padding:6px 0 10px}
.toolbar{grid-column:2;grid-row:1}
.wrap{grid-column:2;grid-row:2;min-height:0}
.ptitle{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.ptitle .crumb{font-size:11.5px;color:var(--muted)}
.ptitle b{font-size:17px;font-weight:600;color:var(--ink);white-space:nowrap}
.toolbar{padding:10px 20px}
.hero p.fecha{margin:0;font-size:14px;color:var(--muted)}
@media (max-width:600px){
  body,body.colap{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);--sbw:auto}
  .top{grid-column:1;grid-row:1;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden}
  .brand{border:0;padding:8px 12px}.brand .lbl{display:none}
  .top .tabs{flex-direction:row;padding:6px 8px 6px 0;flex:none}
  .top .tabs button{width:auto;padding:8px 10px}
  .nsec,.sbfoot{display:none}
  body.colap .top .tabs .lbl{display:inline}
  .top .brand .lbl,body.colap .top .brand .lbl{display:none}
  body.colap .top .tabs button{padding:8px 10px;justify-content:flex-start}
  body.colap .tabs .bdg,.tabs .bdg{position:static;margin-left:2px}
  .toolbar{grid-column:1;grid-row:2;padding:8px 12px}.wrap{grid-column:1;grid-row:3}
}

/* ancho medio (panel al lado del chat): menú solo íconos, indicadores en una fila */
@media (min-width:601px) and (max-width:1100px){
  body{--sbw:64px}
  .top .lbl,.nsec{display:none}
  .brand{justify-content:center;padding:14px 0 12px}
  .top .tabs{padding:8px 8px}
  .top .tabs button,.colapsar{justify-content:center;padding:10px 0;position:relative}
  .tabs .bdg{position:absolute;top:1px;right:2px;margin:0;min-width:16px;font-size:10px;line-height:15px;padding:0 4px}
  .sbuser{justify-content:center;padding:6px 0 10px}.colapsar{display:none}
  .kpis{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .kpi{padding:10px 10px}.kpi .v{font-size:22px}.kpi .l{font-size:11.5px;line-height:1.25;min-height:29px}.kpi .s{font-size:11.5px;white-space:normal;line-height:1.3}
  .resumen p{font-size:13.5px}
  .toolbar{padding:8px 14px}.main{padding:12px}
}
@media (min-width:601px) and (max-width:760px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
</style>

function enLetras(n){
  const U=["","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve","veinte","veintiuno","veintidós","veintitrés","veinticuatro","veinticinco","veintiséis","veintisiete","veintiocho","veintinueve"];
  const D=["","","","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
  const C=["","ciento","doscientos","trescientos","cuatrocientos","quinientos","seiscientos","setecientos","ochocientos","novecientos"];
  function cien(x){ if(x===100) return "cien"; const c=Math.floor(x/100), r=x%100; let s=C[c]; if(r){ s+=(s?" ":"")+(r<30?U[r]:D[Math.floor(r/10)]+(r%10?" y "+U[r%10]:"")); } return s; }
  function mil(x){ if(x<1000) return cien(x); const m=Math.floor(x/1000), r=x%1000; return (m===1?"mil":cien(m).replace(/uno$/,"un")+" mil")+(r?" "+cien(r):""); }
  function todo(x){ if(x===0) return "cero"; if(x<1e6) return mil(x); const M=Math.floor(x/1e6), r=x%1e6; return (M===1?"un millón":mil(M).replace(/uno$/,"un")+" millones")+(r?" "+mil(r):""); }
  const ent=Math.floor(Math.round(n*100)/100), cts=Math.round((n-ent)*100);
  return todo(ent).replace(/uno$/,"un") + (cts?` con ${pad(cts)}/100`:"");
}

// ---------------- números ----------------
function proxNum(tipo){
  const base = BASE[tipo];
  const usados = (tipo==="remito" ? [...DATA.rem.values()] : [...DATA.oc.values()]).map(x => +x.numero||0);
  if (tipo==="remito") DATA.rcc.forEach(r => String(r.remitoTransp||"").split(/[^\d]+/).forEach(n => { if(+n) usados.push(+n); }));
  return Math.max(base, ...usados) + 1;
}

// ---------------- pendientes / alertas ----------------
function diasDesde(f){ const d=parseF(f); return d?Math.floor((Date.now()-d)/864e5):null; }
function diasTxt(n){ return n==null?"—":n===0?"hoy":n===1?"1 día":`${n} días`; }
function alertas(){
  const rccs=ORDER.rcc.map(id=>DATA.rcc.get(id)); const A=[]; const sinKardex=!ORDER.stk.length;
  const add=(o)=>A.push(o);
  if (sinKardex) add({key:"kardex", tit:"Kardex sin leer", nivel:"bad", n:1, sub:"Sin esto no puedo saber qué falta bajar ni qué está bajo mínimo.", head:[], rows:[], act:["syncKardex","Actualizar desde kardex"]});
  // stickers: productos con kardex, sin lote y sin baja
  const stk=[]; const lista=[];
  rccs.forEach(r=>{ if(!completo(r)) return; const ps=prods(r).filter(p=>!p.baja&&kardexDe(p.producto)); if(!ps.length) return;
    const sinL=ps.filter(p=>!String(p.lote||"").trim()); const d=diasDesde(r.fecha);
    if (sinL.length) stk.push({r,d,ps:sinL}); else lista.push({r,d,ps}); });
  stk.sort((a,b)=>(b.d??0)-(a.d??0)); lista.sort((a,b)=>(b.d??0)-(a.d??0));
  const vencS=stk.filter(x=>x.d>30).length;
  add({key:"stickers", tit:"Esperando stickers (falta lote)", nivel:vencS?"bad":"warn", n:stk.length, urg:vencS,
    sub:vencS?`${vencS} con más de 30 días desde la cirugía.`:"Cirugías con productos de kardex que todavía no tienen lote cargado.",
    head:["RCC","Cirugía","Hace","Paciente / Médico","Productos sin lote"],
    rows:stk.map(x=>({go:`rcc:${x.r._id}`, bad:x.d>30, c:[x.r.rcc, fCorta(x.r.fecha), diasTxt(x.d), `${x.r.paciente} · ${apellido(x.r.medico)}`, x.ps.map(p=>`${p.producto}${toNum(p.cant)>1?` ×${p.cant}`:""}`).join(", ")]}))});
  add({key:"bajas", tit:"Listas para dar de baja", nivel:"rev", n:lista.length, urg:lista.filter(x=>x.d>15).length,
    sub:"Tienen todos los lotes cargados; falta escribirlas en el kardex.", head:["RCC","Cirugía","Hace","Paciente","Productos"],
    rows:lista.map(x=>({go:`rcc:${x.r._id}`, c:[x.r.rcc, fCorta(x.r.fecha), diasTxt(x.d), x.r.paciente, String(x.ps.length)]})), act:["bajasPend","Dar de baja en tanda"]});
  const rev=rccs.filter(r=>estado(r)[0]==="rev"), fal=rccs.filter(r=>estado(r)[0]==="warn");
  add({key:"revisar", tit:"RCC a revisar", nivel:"warn", n:rev.length, sub:"Tienen una observación pendiente antes de darlos por buenos.", head:["RCC","Fecha","Paciente","Qué revisar"],
    rows:rev.map(r=>({go:`rcc:${r._id}`, c:[r.rcc, fCorta(r.fecha), r.paciente, r.revisar]}))});
  add({key:"faltan", tit:"RCC sin productos", nivel:"warn", n:fal.length, sub:"Cirugías sin consumo cargado.", head:["RCC","Fecha","Paciente","Médico"],
    rows:fal.map(r=>({go:`rcc:${r._id}`, c:[r.rcc, fCorta(r.fecha), r.paciente, r.medico]}))});
  // reposición
  const pen=pendientes(); const porProv=new Map(); pen.forEach(x=>{ if(!porProv.has(x.prov)) porProv.set(x.prov,{n:0,u:0,rccs:new Set(),d:0}); const g=porProv.get(x.prov); g.n++; g.u+=toNum(x.p.cant)||1; g.rccs.add(x.r.rcc); g.d=Math.max(g.d, diasDesde(x.r.fecha)||0); });
  add({key:"reponer", tit:"Consumo sin pasar a OC", nivel:"rev", n:pen.length, sub:"Lo consumido en cirugías que todavía no está en ninguna OC. Lo mandás cuando quieras.", head:["Proveedor","Ítems","Unidades","Más viejo","RCC"],
    rows:[...porProv].sort((a,b)=>b[1].d-a[1].d).map(([p,g])=>({c:[p, String(g.n), String(g.u), diasTxt(g.d), [...g.rccs].join(", ")]})), act:["armarOC","Reponer pendientes"]});
  const bm=sinKardex?[]:pendientesStock();
  add({key:"minimo", tit:"Stock bajo mínimo", nivel:"bad", n:bm.length, urg:bm.filter(x=>x.k.disp===0).length, sub:"Ya descuenta lo pedido en OCs abiertas y lo consumido pendiente de reponer.", head:["Producto","Proveedor","Disp.","Mín.","Falta pedir"],
    rows:bm.map(x=>({go:`stk:${x.k._id}`, bad:x.k.disp===0, c:[x.k.desc, x.k.prov, String(x.k.disp), String(x.k.minimo), String(x.falta)]})), act:["armarOC","Reponer pendientes"]});
  // OC
  const ocs=ORDER.oc.map(id=>DATA.oc.get(id)).filter(o=>(o.items||[]).some(i=>i.desc));
  const emi=ocs.filter(o=>(o.estado||"Emitida")==="Emitida"), esp=ocs.filter(o=>/^Enviada$|parcial/.test(o.estado||""));
  add({key:"ocEmit", tit:"OC armadas sin enviar", nivel:"warn", n:emi.length, sub:"Cuando la mandes, pasala a “Enviada”.", head:["OC","Fecha","Hace","Proveedor","Ítems"],
    rows:emi.map(o=>({go:`oc:${o._id}`, c:[o.numero, fCorta(o.fecha), diasTxt(diasDesde(o.fecha)), o.proveedor, String((o.items||[]).filter(i=>i.desc).length)]}))});
  add({key:"ocEsp", tit:"OC esperando mercadería", nivel:"rev", n:esp.length, urg:esp.filter(o=>diasDesde(o.fecha)>15).length, sub:"Enviadas o recibidas en parte. Al llegar: “Recibir mercadería”.", head:["OC","Fecha","Hace","Proveedor","Estado"],
    rows:esp.map(o=>({go:`oc:${o._id}`, bad:diasDesde(o.fecha)>15, c:[o.numero, fCorta(o.fecha), diasTxt(diasDesde(o.fecha)), o.proveedor, o.estado]}))});

    rows:rs.map(x=>({go:`rem:${x._id}`, bad:diasDesde(x.fecha||x.emision)>7, c:[x.numero, fCorta(x.fecha), diasTxt(diasDesde(x.fecha||x.emision)), x.institucion, x.paciente]}))});
  // vencimientos
  const lim=new Date(); lim.setMonth(lim.getMonth()+6); const ven=[];
  DATA.stk.forEach(k=>Object.entries(k.lotes||{}).forEach(([l,v])=>{ if(v.disp>0&&v.vtoD&&new Date(v.vtoD)<lim) ven.push({k,l,v,venc:new Date(v.vtoD)<new Date()}); }));
  ven.sort((a,b)=>a.v.vtoD.localeCompare(b.v.vtoD));
  add({key:"vence", tit:"Vencidos o por vencer (< 6 meses)", nivel:ven.some(x=>x.venc)?"bad":"warn", n:ven.length, urg:ven.filter(x=>x.venc).length, sub:"Lotes con unidades disponibles.", head:["Producto","Lote","Vence","Disp."],
    rows:ven.map(x=>({go:`stk:${x.k._id}`, bad:x.venc, c:[x.k.desc, x.l, x.v.vto+(x.venc?" (vencido)":""), String(x.v.disp)]}))});
  const kerr=[...DATA.stk.values()].filter(k=>k.error);
  add({key:"kerr", tit:"Planillas de kardex con error", nivel:"bad", n:kerr.length, sub:"No las pude leer; revisá link y nombre de pestaña en el Catálogo Maestro.", head:["Producto","Pestaña","Error"],
    rows:kerr.map(k=>({go:`stk:${k._id}`, c:[k.desc, k.hoja, k.error]})), act:["syncKardex","Volver a leer kardex"]});
  alertasSgc(add);
  return A;
}
function badges(){
  const A=alertas(); const by=k=>A.find(a=>a.key===k)?.n||0;
  const m={pen:A.filter(a=>a.n).reduce((s,a)=>s+a.n,0), rcc:by("stickers")+by("bajas")+by("revisar")+by("faltan"), oc:by("reponer")+by("ocEmit")+by("ocEsp"), rem:by("remitos"), stk:by("minimo")+by("vence")+by("kerr"), sgc:by("sgcVenc")+by("sgcAbiertos")+by("sgcProv")};

    if(!n){ s?.remove(); return; } if(!s){ s=document.createElement("span"); s.className="bdg"; b.appendChild(s); } s.textContent=n>99?"99+":n; });

  if (mod==="oc") for (const id of ORDER.oc){

    if (f==="emit"&&e!=="Emitida"||f==="env"&&e!=="Enviada"||f==="rec"&&!/Recibida/.test(e)) continue;
    if (q && !norm(`${o.numero} ${o.proveedor} ${o.obs}`).includes(q)) continue;
    const t = totalesOC(o);
    html += head(o.fecha) + `<div class="item" role="button" tabindex="0" data-id="${id}" aria-current="${id===sel.oc}">
      <span class="n">${esc(o.numero)}</span><span class="p">${esc(o.proveedor||"—")}</span>

      <span class="f">${esc(fCorta(o.fecha))}</span><span class="s">${o.moneda==="USD"?"US$":"$"} ${money(t.total)} · ${(o.items||[]).filter(i=>i.desc).length} ítems</span></div>`;
  }
  if (mod==="rec") for (const id of ORDER.rec){ const x=DATA.rec.get(id);
    if (q && !norm(`${x.oc} ${x.proveedor} ${x.remitoProv} ${x.factura}`).includes(q)) continue;
    html += head(x.fecha) + `<div class="item" role="button" tabindex="0" data-id="${id}" aria-current="${id===sel.rec}">
      <span class="n">OC ${esc(x.oc)}</span><span class="p">${esc(x.proveedor)}</span>
      <span class="chips"><span class="chip ${x.kardexOk?"ok":"warn"}">${x.kardexOk?"En kardex":"Sin kardex"}</span></span>
      <span class="f">${esc(fCorta(x.fecha))}</span><span class="s">Remito ${esc(x.remitoProv||"—")} · ${(x.items||[]).reduce((a,i)=>a+toNum(i.cant),0)} u.</span></div>`; }
  if (mod==="stk"){ const grupos=new Map(); for (const id of ORDER.stk){ const k=DATA.stk.get(id); const f=filtro.stk;
      if (f==="bajo"&&!bajoMin(k)||f==="vence"&&!venceProx(k)) continue;
      if (q && !norm(`${k.code} ${k.desc} ${k.prov}`).includes(q)) continue;
      const g=k.prov||"Sin proveedor"; if(!grupos.has(g)) grupos.set(g,[]); grupos.get(g).push(k); }
    for (const [g,ks] of grupos){ html+=`<div class="month">${esc(g)}</div>`;
      ks.forEach(k => { const b=bajoMin(k); html+=`<div class="item" role="button" tabindex="0" data-id="${k._id}" aria-current="${k._id===sel.stk}">
        <span class="n">${k.disp}</span><span class="p">${esc(k.desc)}</span>
        <span class="chips">${k.error?`<span class="chip warn">Error</span>`:b?`<span class="chip warn">Mín ${k.minimo}</span>`:k.minimo?`<span class="chip ok">OK</span>`:""}</span>
        <span class="f">${esc(k.code)}</span><span class="s">${Object.keys(k.lotes||{}).filter(l=>k.lotes[l].disp>0).length} lotes · ${esc(k.hoja)}</span></div>`; }); } }
  document.getElementById("list").innerHTML = html || `<div class="empty">${mod==="stk"&&!ORDER.stk.length?"Todavía no leí el kardex. Tocá “Actualizar desde kardex”.":"Nada para mostrar."}</div>`;
  renderStats();
}

  [/cage.*pin|c\/?pin/, "cage pin"], [/\bbloq|cage bloq|2 bloq|cage tt|cage cerv/, "cage"], [/tlif|plif|cage lumbar|lumbar tt/, "plif-tlif"],
  [/alif/, "alif"], [/xlif/, "xlif"], [/placa cerv/, "placa cervical"], [/expan|expandible|celda exp/, "expandible"], [/mesh/, "celda mesh"],
  [/drill|craneotomo/, "drill"], [/vtp|vertebro/, "vtp"], [/cifo/, "cifo_nov"], [/ostium/, "ostium"], [/haemocer|hemostat/, "haemocer"],
  [/sellador/, "sellador"], [/trim/, "trim"], [/tubular|separador/, "dist_tubular"], [/rodilla|rtr/, "rtr"], [/valvula|válvula/, "valvula"],
  [/lumboperit/, "valv_lp"], [/cr[aá]neo 3d|malla 3d/, "cran3d"], [/malla.*cr[aá]neo|malla p cr/, "malla_3D"], [/cemento.*cr[aá]neo/, "cem_craneo"],
  [/microplaca|cierres/, "microplacas"], [/extracci|set de ext/, "set_ext"], [/osteotomo|osteótomo/, "instru"], [/halo/, "halo"], [/interespin/, "inter_nvx"],
  [/dtt/, "dtt"],

function sugerirSistemas(texto){
  const t = norm(texto); const out=[];
  SUGERIR.forEach(([re,cod]) => { if (re.test(t) && !out.includes(cod)) out.push(cod); });
  if (/rodilla|rtr/.test(t)) out.push("rtr-imp");
  return out.map(cod => { const s=SISTM.get(norm(cod)); return {codigo:s.cod, desc:s.desc, marca:s.marca, cajas:"1"}; });
}

// ---------------- OC ----------------
function totalesOC(o){
  let neto=0; const iva={};
  (o.items||[]).forEach(i => { const t=toNum(i.cant)*toNum(i.unit); neto+=t; const a=String(i.iva||"21"); if(a!=="0"&&a!=="Exento") iva[a]=(iva[a]||0)+t*toNum(a.replace(",","."))/100; });
  const desc=toNum(o.descuento); const totalIva=Object.values(iva).reduce((a,b)=>a+b,0);
  return {neto, iva, desc, total: neto - desc + totalIva};
}

function itemOC(p, info){ return {codigo:info?.cod||"", desc:p.producto, cant:toNum(p.cant)||1, unit:info?.costo!=null?String(info.costo).replace(".",","):"", iva:"21", _mon:info?.mon||"ARS"}; }
async function pasarAOC(prov, sel, destinoId, extras=[]){
  // sel: [{rid, idx}]
  const lineas=sel.map(s=>{ const r=DATA.rcc.get(s.rid); const p=r.productos[s.idx]; return {s, r, p, info:CAT.get(p.producto)}; });
  let oc, id;
  if (destinoId){ id=destinoId; oc=DATA.oc.get(id); }
  else { const rids=[...new Set(sel.map(s=>s.rid))]; const cx=rids.length===1?DATA.rcc.get(rids[0]):null;
    id=nuevaOC(prov, [], [], cx); oc=DATA.oc.get(id);
    const mons=lineas.map(l=>l.info?.mon||"ARS"); oc.moneda=mons.length&&mons.every(m=>m==="USD")?"USD":"ARS"; }
  oc.items=(oc.items||[]).filter(i=>i&&(i.desc||i.codigo));
  extras.forEach(x => { const ex=oc.items.find(i=>norm(i.desc)===norm(x.desc)); if(ex) ex.cant=String(toNum(ex.cant)+x.cant); else oc.items.push({codigo:x.codigo, desc:x.desc, cant:String(x.cant), unit:x.unit, iva:"21"}); });
  if(!sel.length && extras.length) oc.obs=(oc.obs?oc.obs+". ":"")+"Reposición de stock bajo mínimo";
  lineas.forEach(l => { const it=itemOC(l.p,l.info); const ex=oc.items.find(i=>norm(i.desc)===norm(it.desc));
    if(ex) ex.cant=String(toNum(ex.cant)+it.cant); else { delete it._mon; it.cant=String(it.cant); oc.items.push(it); } });
  const rids=[...new Set(sel.map(s=>s.rid))];
  oc.rccs=[...new Set([...(oc.rccs||[]),...rids])];
  if(rids.length){ const ref=rids.map(rid=>{const r=DATA.rcc.get(rid);return `RCC ${r.rcc} (${pac1(r.paciente)})`;}).join(", ");
    oc.obs=(oc.obs?oc.obs+". ":"")+"Reposición "+ref; }
  await guardar("oc",id,true);
  for (const rid of rids){ const r=DATA.rcc.get(rid); sel.filter(s=>s.rid===rid).forEach(s=>{ r.productos[s.idx].oc=+oc.numero; }); await guardar("rcc",rid,true); }
  return id;
}

DATA.meta = null; let MAESTRO = new Map(); // codigo normalizado -> fila catálogo
const ncode = s => String(s||"").toLowerCase().replace(/[\s\-_.]/g,"");
function sheetIdDe(url){ const m=String(url||"").match(/\/d\/([A-Za-z0-9_-]+)/); return m?m[1]:""; }
function kardexDe(producto){
  const info=CAT.get(producto); let k=null;
  if (info?.cod){ const id="k_"+ncode(info.cod); k=DATA.stk.get(id); }
  if (!k){ const n=norm(producto); for (const x of DATA.stk.values()){ if (norm(x.desc)===n){ k=x; break; } } }
  return k;
}
function bajoMin(k){ return k.minimo>0 && k.disp < k.minimo; }
function venceProx(k){ const lim=new Date(); lim.setMonth(lim.getMonth()+6); return Object.values(k.lotes||{}).some(l=>l.disp>0&&l.vtoD&&new Date(l.vtoD)<lim); }
function parseVto(s){ s=String(s||"").trim(); const M={ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,oct:9,nov:10,dic:11};
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if(m){const y=m[3].length===2?2000+ +m[3]:+m[3]; return new Date(y,+m[2]-1,+m[1]).toISOString();}
  m=s.match(/^(\d{1,2})[\/-](\d{4})$/); if(m) return new Date(+m[2],+m[1]-1,28).toISOString();
  m=s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/); if(m) return new Date(+m[3],+m[2]-1,+m[1]).toISOString();
  m=s.match(/^([a-z]{3})[a-z]*[-\/ ](\d{2,4})$/i); if(m&&M[m[1].toLowerCase()]!=null){ const y=m[2].length===2?2000+ +m[2]:+m[2]; return new Date(y,M[m[1].toLowerCase()],28).toISOString(); }
  return null; }
function parseKardex(values){
  // devuelve unidades: {row, fecha, lote, vto, remito, egreso, rcc, disp}
  const out=[]; (values||[]).forEach((r,i) => { const c=String(r[2]||"").trim(), lote=String(r[3]||"").trim();
    if (!lote || !/^\d+$/.test(c) || i<5) return;
    const rcc=String(r[7]||"").trim();
    out.push({row:i+1, fecha:r[1]||"", cant:+c, lote, vto:r[4]||"", remito:r[5]||"", egreso:r[6]||"", rcc, disp:rcc==="" }); });
  return out; }
function resumen(units){ const lotes={}; let disp=0;
  units.forEach(u => { const L=lotes[u.lote]||(lotes[u.lote]={vto:u.vto, vtoD:parseVto(u.vto), disp:0, total:0}); L.total+=u.cant; if(u.disp){ L.disp+=u.cant; disp+=u.cant; } });
  return {lotes, disp}; }
async function gs(tool, input){ if(!mcp) throw {code:"capability_disabled"}; const r=await mcp.callTool(GS, tool, input, {cache:false}); return r.payload; }
async function leerTab(sid, hoja){ const p=await gs("get_values",{spreadsheetId:sid, range:`'${hoja.replace(/'/g,"''")}'!A1:J`}); return (p&&p.values)||[]; }
function errTxt(e){ const c=e?.code; if(c==="needs_reauth") return "Reconectá Google Sheets en claude.ai → Configuración → Conectores.";
  if(c==="server_not_connected") return "Agregá el conector Google Sheets en claude.ai → Configuración → Conectores.";
  if(c==="not_in_manifest"||c==="approval_required") return "Hace falta permitir que esta página use Google Sheets (claude.ai te lo pregunta).";
  if(c==="tool_error") return "Google Sheets respondió con error: "+String(e.message||"").slice(0,160);
  return (e?.message||c||"error desconocido"); }

async function syncKardex(btn){
  const t0=btn?.textContent; if(btn){ btn.disabled=true; btn.textContent="Leyendo catálogo…"; }
  try{
    const p=await gs("get_values",{spreadsheetId:MAESTRO_ID, range:"catalogo!A3:K"}); const rows=(p&&p.values)||[];
    const prods=rows.filter(r=>r&&r[0]&&r[4]&&r[5]).map(r=>({code:String(r[0]).trim(), desc:r[1]||"", prov:r[2]||"", marca:r[3]||"", sid:sheetIdDe(r[4]), hoja:String(r[5]).trim(), precioOC:r[6]||"", minimo:toNum(r[8]), activo:r[10]||""}));
    let hechos=0, errores=0; const cola=[...prods];
    const worker=async()=>{ while(cola.length){ const pr=cola.shift(); const id="k_"+ncode(pr.code);
        let doc; try{ const units=parseKardex(await leerTab(pr.sid, pr.hoja)); const r=resumen(units); doc={...pr, ...r, error:"", leido:hoy()}; }
        catch(e){ errores++; doc={...pr, lotes:{}, disp:0, error:errTxt(e), leido:hoy()}; if(e?.code==="needs_reauth"||e?.code==="server_not_connected"||e?.code==="not_in_manifest") { cola.length=0; } }
        DATA.stk.set(id,{...doc,_id:id}); await db.doc("kardex/"+id).set(doc).catch(()=>{});
        hechos++; if(btn) btn.textContent=`Leyendo kardex ${hechos}/${prods.length}…`; } };
    await Promise.all([worker(),worker(),worker(),worker()]);
    DATA.meta={sync:new Date().toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"})}; await db.doc("meta/kardex").set(DATA.meta).catch(()=>{});
    ORDER.stk=[...DATA.stk.keys()].sort((a,b)=>(DATA.stk.get(a).prov+DATA.stk.get(a).desc).localeCompare(DATA.stk.get(b).prov+DATA.stk.get(b).desc));
    render(); aviso(`Kardex leído: ${prods.length} productos${errores?`, ${errores} con error (marcados en la lista)`:""}.`, errores?"err":"ok");
  }catch(e){ aviso("No pude leer el Catálogo Maestro: "+errTxt(e)); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=t0; } }
}

async function darBajaRCC(rid){
  const r=DATA.rcc.get(rid); const res={ok:0, err:[]};
  const pac=String(r.paciente||"").replace(/,/g,"").trim().split(/\s+/)[0]||""; const mp=`${apellido(r.medico)}/${pac}`;
  for (let idx=0; idx<(r.productos||[]).length; idx++){
    const p=r.productos[idx]; if(!p||!p.producto||p.baja) continue; const k=kardexDe(p.producto); if(!k) continue;
    const cant=toNum(p.cant)||1;
    try{
      const units=parseKardex(await leerTab(k.sid,k.hoja)).filter(u=>u.disp);
      let cand=p.lote?units.filter(u=>norm(u.lote)===norm(p.lote)):units.slice().sort((a,b)=>(parseVto(a.vto)||"9").localeCompare(parseVto(b.vto)||"9"));
      if(cand.length<cant){ res.err.push(`${p.producto}: ${p.lote?`el lote ${p.lote} tiene ${cand.length} disponibles`:"no hay stock disponible"} en ${k.hoja}`); continue; }
      const usar=cand.slice(0,cant); const fecha=r.fecha||hoy();
      for (const u of usar) await gs("update_values",{spreadsheetId:k.sid, range:`'${k.hoja.replace(/'/g,"''")}'!G${u.row}:I${u.row}`, values:[[fecha, r.rcc, mp]]});
      p.baja={fecha:hoy(), lote:usar[0].lote, rows:usar.map(u=>u.row), asumido:!p.lote}; p.lote=p.lote||usar[0].lote; res.ok++;
      const units2=parseKardex(await leerTab(k.sid,k.hoja)); Object.assign(k, resumen(units2)); await db.doc("kardex/"+k._id).set((({_id,...d})=>d)(k)).catch(()=>{});
    }catch(e){ res.err.push(`${p.producto}: ${errTxt(e)}`); if(["needs_reauth","server_not_connected","not_in_manifest","approval_required"].includes(e?.code)) break; }
  }
  await guardar("rcc",rid,true); return res;
}

async function guardarRecepcion(btn){

function setPath(x, path, val){
  const [k,i,f]=path.split(".");
  if (k==="p"){ x.productos=x.productos||[]; x.productos[+i]=x.productos[+i]||{}; x.productos[+i][f]=val; }
  else if (k==="i"){ x.items=x.items||[]; x.items[+i]=x.items[+i]||{}; x.items[+i][f]=val; }
  else if (k==="d"){ x.descartables=x.descartables||{}; x.descartables[i]=val; }
  else x[path]=val;
}
function limpiar(x){
  const out=JSON.parse(JSON.stringify(x)); delete out._id;
  ["productos","items"].forEach(k => { if(out[k]) out[k]=out[k].map(p=>p||{}).filter((p,i,a)=>a.slice(i).some(y=>Object.values(y).some(Boolean))); });
  return out;
}
function guardar(m, id, inmediato){
  const key=m+":"+id; clearTimeout(pending.get(key));
  const run=async()=>{ pending.delete(key); try{ await db.doc(COL[m]+"/"+id).set(limpiar(DATA[m].get(id))); }catch(e){ aviso("No se pudo guardar: "+(e.message||e.code)+". Probá de nuevo en un momento."); } };
  if (inmediato) return run();
  pending.set(key, setTimeout(run, 700));
}
function avisoLink(msg, url){ const n=document.createElement("div"); n.className="note ok"; n.innerHTML=`${esc(msg)} ${url?`<a href="${esc(url)}" target="_blank" rel="noopener">Abrir</a>`:""}`; document.getElementById("main").prepend(n); setTimeout(()=>n.remove(), 12000); }
function aviso(msg, tipo="err"){ const n=document.createElement("div"); n.className="note "+tipo; n.textContent=msg; document.getElementById("main").prepend(n); setTimeout(()=>n.remove(), 9000); }

function carpeta(tipo){ const c=CARP[tipo]; return c&&c.id?c:null; }
function idCarpeta(s){ s=String(s||"").trim(); const m=s.match(/folders\/([\w-]{10,})/)||s.match(/[?&]id=([\w-]{10,})/); return m?m[1]:(/^[\w-]{20,}$/.test(s)?s:""); }
async function gd(tool, input){ if(!mcp) throw {code:"capability_disabled"}; const r=await mcp.callTool(GD, tool, input, {cache:false}); return r.payload; }
const _subCache = new Map();
async function subcarpeta(padre, nombre){
  const k=padre+"/"+nombre; if(_subCache.has(k)) return _subCache.get(k);
  const q=`parentId = '${padre}' and title = '${nombre.replace(/'/g,"\\'")}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false`;
  const r=await gd("search_files",{query:q, pageSize:5, excludeContentSnippets:true});
  let id=(r&&r.files&&r.files[0]&&r.files[0].id)||"";
  if(!id){ const c=await gd("create_file",{title:nombre, parentId:padre, contentMimeType:"application/vnd.google-apps.folder"}); id=c.id||(c.file&&c.file.id)||""; }
  if(!id) throw new Error("No pude crear la subcarpeta "+nombre);
  _subCache.set(k,id); return id;
}
function blobB64(blob){ return new Promise((ok,ko)=>{ const fr=new FileReader(); fr.onload=()=>ok(String(fr.result).split(",")[1]); fr.onerror=ko; fr.readAsDataURL(blob); }); }
async function subirDrive(tipo, fecha, nombre, blob){
  const c=carpeta(tipo); let padre=c.id; const d=parseF(fecha)||new Date(); const mes=MESES[d.getMonth()].toUpperCase();
  if(c.sub==="mes") padre=await subcarpeta(padre, mes);
  if(c.sub==="mesanio") padre=await subcarpeta(padre, `${mes} ${d.getFullYear()}`);
  if(c.sub==="anio_mes"){ padre=await subcarpeta(padre, String(d.getFullYear())); padre=await subcarpeta(padre, mes); }
  const f=await gd("create_file",{title:nombre, parentId:padre, base64Content:await blobB64(blob), contentMimeType:"application/pdf", disableConversionToGoogleType:true});
  const id=f.id||(f.file&&f.file.id)||""; return {id, url:f.viewUrl||(f.file&&f.file.viewUrl)||(id?`https://drive.google.com/file/d/${id}/view`:"")};
}
function errDrive(e){ const c=e&&e.code; if(c==="needs_reauth") return "Reconectá Google Drive en claude.ai → Configuración → Conectores."; if(c==="server_not_connected") return "Conectá Google Drive en claude.ai → Configuración → Conectores."; if(c==="approval_required"||c==="declined") return "Hace falta aprobar el uso de Google Drive en esta página."; return (e&&(e.message||e.code))||String(e); }

async function pdfRCC(r, opt={}){
  const lista=Array.isArray(r)?r:[r];
  const doc=new jspdf.jsPDF({unit:"pt",format:"letter"});
  for(let k=0;k<lista.length;k++){ if(k) doc.addPage(); await dibujarRCC(doc, lista[k]); }
  if(lista.length===1) doc.setProperties({title:nombreRCC(lista[0])});
  if(opt.imprimir) doc.autoPrint();
  return doc.output("blob");
}
async function dibujarRCC(doc, r){
  const X0=43, W=526, PCT=[14.2,14.3,14.3,11.5,15.5,10.3,19.9];
  const xs=[X0]; PCT.forEach(p=>xs.push(xs[xs.length-1]+p*W/100));
  const NAVY=[29,44,124], LIGHT=[214,214,214], XLIGHT=[226,226,226], DARK=[40,40,40], PEACH=[252,229,212];
  const FS=8.2; let y=36;
  const p=r.productos||[], d=r.descartables||{};
  function txt(s, x0, x1, yy, h, o={}){
    s=String(s??""); if(!s) return;
    let size=o.size||FS; doc.setFont("helvetica", o.bold?"bold":"normal"); doc.setFontSize(size);
    const max=x1-x0-6; while(doc.getTextWidth(s)>max && size>5.5){ size-=0.3; doc.setFontSize(size); }
    while(doc.getTextWidth(s)>max && s.length>1) s=s.slice(0,-1);
    const ty=yy+h/2+size*0.35;
    if(o.align==="center") doc.text(s,(x0+x1)/2,ty,{align:"center"}); else if(o.align==="right") doc.text(s,x1-3,ty,{align:"right"}); else doc.text(s,x0+3,ty);
  }
  // fila: cells=[[span, texto, opts]], h, estilo {border, fill, line}
  function fila(cells, h, st={}){
    let c=0;
    cells.forEach(([span, s, o={}])=>{
      const x0=xs[c], x1=xs[c+span];
      if(st.fill){ doc.setFillColor(...st.fill); doc.rect(x0,y,x1-x0,h,"F"); }
      if(st.border!==false){ doc.setDrawColor(...(st.border||LIGHT)); doc.setLineWidth(st.lw||0.5); doc.rect(x0,y,x1-x0,h,"S"); }
      txt(s,x0,x1,y,h,o); c+=span;
    });
    if(st.top){ doc.setDrawColor(...DARK); doc.setLineWidth(0.9); doc.line(xs[0],y,xs[7],y); }
    y+=h;
  }
  const B={bold:true}, C={align:"center"}, BC={bold:true,align:"center"};
  // barra azul + encabezado
  doc.setFillColor(...NAVY); doc.rect(xs[0],y-3,W,3,"F");
  const hh=36; doc.setDrawColor(...DARK); doc.setLineWidth(0.6);
  doc.rect(xs[0],y,xs[3]-xs[0],hh); doc.rect(xs[3],y,xs[6]-xs[3],hh); doc.rect(xs[6],y,xs[7]-xs[6],hh);
  const ld=await logoDim(); const lh=27, lw=lh*ld.w/ld.h; try{ doc.addImage(LOGO,"PNG",(xs[0]+xs[3])/2-lw/2,y+(hh-lh)/2,lw,lh); }catch(e){}
  txt("REGISTRO DE CONSUMO DE CIRUGIA- TRAZABILIDAD",xs[3],xs[6],y,hh,{bold:true,align:"center"});
  doc.setFont("helvetica","normal"); doc.setFontSize(8.2); doc.text("FORM POE 14-01",(xs[6]+xs[7])/2,y+hh/2-2,{align:"center"}); doc.text("REV 2",(xs[6]+xs[7])/2,y+hh/2+8,{align:"center"});
  y+=hh+4;
  // datos
  const RH=13.5;
  fila([[1,"N° RCC:",B],[1,r.rcc],[1,""],[2,"FECHA DE CIRUGIA:",BC],[2,fCorta(r.fecha)]],RH,{top:true});
  fila([[1,"PACIENTE:",B],[6,r.paciente]],RH);
  fila([[1,"OBRA SOCIAL:",B],[6,r.os]],RH);
  fila([[1,"MEDICO:",B],[4,r.medico],[1,"M.P. Nº:",B],[1,mpDe(r)]],RH);
  fila([[2,"TECNICO INSTRUMENTADOR:",B],[3,r.instru],[1,"M.P. Nº:",B],[1,r.instruMp]],RH);
  fila([[1,"INSTITUCION:",B],[6,r.institucion]],RH);
  fila([[2,"REMITO SURCHERIE Nº:",B],[2,r.remitoSur,B],[2,"REMITO TRANSPORTE Nº:",B],[1,r.remitoTransp]],RH);
  y+=4;
  // productos
  const PH=12.75, PR=11.6;
  fila([[3,"PRODUCTOS IMPLANTADOS",B],[2,"MODELO/ MARCA:",BC],[1,"CANTIDAD:",BC],[1,"PROVEEDOR",BC]],PH,{fill:PEACH,border:DARK});
  for(let i=0;i<NPROD;i++){ const it=p[i]||{}; fila([[3,it.producto],[2,it.marca,C],[1,it.cant,C],[1,it.proveedor,C]],PR); }
  // descartables
  fila([[7,"DESCARTABLES",B]],PH,{fill:PEACH,border:DARK});
  [0,1,2,3].forEach(i=>{ const a=DESC[i], b=DESC[4+i], s=SETS[i-1];
    const base=[[1,a[1]],[1,d[a[0]],C],[1,b?b[1]:""],[1,b?d[b[0]]:"",C]];
    fila(base.concat(i===0?[[1,"Sets",C],[1,"Cant",C],[1,"Modelo/Marca",C]]:[[1,s[1],C],[1,d[s[0]],C],[1,d[s[0]+"_m"],C]]),12); });
  fila([[1,"OBSERVACIONES",{bold:true,size:7.6}],[6,r.obs]],13.5,{border:DARK,lw:0.6});
  fila([[7,"STICKERS",B]],PH,{fill:PEACH,border:DARK});
  // grilla de stickers hasta el pie
  const FH=15, fondo=792-30-2*FH, SR=12.3;
  const nS=Math.max(1,Math.floor((fondo-y)/SR)), hS=(fondo-y)/nS;
  for(let i=0;i<nS;i++) fila([[1,""],[1,""],[1,""],[1,""],[1,""],[1,""],[1,""]],hS,{border:XLIGHT});
  y=fondo;
  // pie
  doc.setDrawColor(...DARK); doc.setLineWidth(0.6);
  doc.rect(xs[0],y,xs[3]-xs[0],2*FH);
  doc.setFontSize(7); doc.setFont("helvetica","bold"); doc.text("EVALUÓ Y CONFECCIONÓ:",xs[0]+3,y+11); doc.text("APROBÓ:",xs[0]+3,y+21);
  doc.setFont("helvetica","normal"); doc.text("Bioing. Deris Melisa",xs[0]+3+doc.getTextWidth("EVALUÓ Y CONFECCIONÓ: ")+4,y+11); doc.text("Ing. Gustavo Cobelli",xs[0]+3+doc.getTextWidth("APROBÓ: ")+4,y+21);
  const y0=y; y=y0; [[3,5,"Nombre del archivo",BC],[5,6,"FECHA:",B],[6,7,fConf(r.fecha),C]].forEach(([a,b,s,o])=>{ doc.setDrawColor(...DARK); doc.rect(xs[a],y,xs[b]-xs[a],FH); txt(s,xs[a],xs[b],y,FH,o); });
  y=y0+FH; [[3,5,nombreRCC(r),C],[5,6,"FIRMA:",B],[6,7,""]].forEach(([a,b,s,o])=>{ doc.setDrawColor(...DARK); doc.rect(xs[a],y,xs[b]-xs[a],FH); txt(s,xs[a],xs[b],y,FH,o||{}); });
  y=y0+2*FH; doc.setFillColor(...NAVY); doc.rect(xs[0],y,W,3,"F");
}
async function pdfDe(m, x){ if(m==="rcc") return pdfRCC(x); return pdfBlob(m==="rem"?paperRem(x,false):m==="rec"?paperRec(x):paperOC(x,false)); }

async function pdfBlob(html, opt={}){
  const host=document.getElementById("offscreen"); host.innerHTML=html; const el=host.firstElementChild;
  await Promise.all([...el.querySelectorAll("img")].map(i=>i.complete?0:new Promise(ok=>i.onload=i.onerror=ok)));
  const canvas=await html2canvas(el,{scale:3,backgroundColor:"#ffffff"});
  const carta=el.classList.contains("carta"), PW=carta?215.9:210, PH=carta?279.4:297;
  const pdf=new jspdf.jsPDF({unit:"mm",format:carta?"letter":"a4",orientation:"portrait"});
  let w=PW,h=canvas.height*w/canvas.width; if(h>PH){ h=PH; w=canvas.width*h/canvas.height; }
  pdf.addImage(canvas.toDataURL("image/jpeg",0.95),"JPEG",(PW-w)/2,0,w,h); host.innerHTML=""; if(opt.imprimir) pdf.autoPrint(); return pdf.output("blob");
}

     if(hechos<n) return ["warn",`Faltan ${n-hechos} ítems`]; if(no&&!String(x.desvios||"").trim()) return ["warn","Detallar desvíos"]; if(no) return ["rev",`${no} no cumple`]; break; }
   case "S16": if([x.venc,x.prox,x.dif].some(v=>v===""||v==null)||!x.fefo||!x.envases) return ["warn","Incompleto"]; if((+x.venc>0||+x.dif>0||x.fefo==="No"||x.envases==="No")&&!String(x.acciones||"").trim()) return ["warn","Indicar acción"]; break;
   case "P10": if(!x.cert) return ["warn","Falta certificado"]; if(!x.archivado) return ["warn","Archivar certificado"]; if(x.hallazgos==="Actividad detectada") return ["rev","Actividad: abrir POE-08"]; break;
   case "I12": if(x.resultado==="No apto") return ["bad","No apto"]; break;
   case "L10": if(x.resultado==="No cumple"&&!String(x.obs||"").trim()) return ["warn","Detallar observación"]; break;
   case "REC": if(x.cierre) return (x.reparadora&&x.eficacia)?["ok","Cerrado"]:["warn","Cerrado sin acción/verificación"]; if(!x.clasif) return ["warn","Sin evaluar"]; return ["rev","Abierto"];
   case "NC": return x.cierre?["ok","Cerrado"]:["rev","Abierto"];
   case "RET": return x.cierre?["ok","Cerrado"]:["bad","Abierto"];
   case "BAJ": if(!x.fkardex) return ["warn","Falta baja en kardex"]; if(x.destino==="Devuelto a proveedor"&&!x.remdev) return ["warn","Falta remito devolución"]; break;
   case "DEV": if(!x.kardex) return ["warn","Falta baja en kardex"]; break;
   case "AC": if(x.eficacia==="Eficaz") return ["ok","Cerrada"]; if(x.frealiz) return ["rev","A verificar"]; { const p=parseF(x.plazo); if(p&&p<H) return ["bad","Vencida"]; } return ["warn","En curso"];
   case "EVAL": { const r=resultadoEval(x); if(!r) return ["warn","Incompleta"]; if(t.vb&&!x.vb) return ["warn","Sin firma DT"]; return [r==="No apto"?"bad":"ok",r]; }
   case "PROV": return provInfo(x).est;
   case "EQ": return eqInfo(x).est;
   case "REV": case "AUD": if(!x.fecha){ const p=parseF(x.fprev||x.fprog); return p&&p<H?["bad","Vencida"]:["warn","Pendiente"]; } break;
   case "DOCI": return [x.estado==="Vigente"?"ok":x.estado==="Obsoleto"?"mute":"warn", x.estado||"Sin estado"];
   case "DOCE": { const u=parseF(x.ultver); if(!u) return ["warn","Sin verificar"]; if(addMeses(u,12)<H) return ["bad","Verificación vencida"]; return ["ok",x.estado||"Vigente"]; }
  }
  if(t.vb&&!x.vb) return ["warn","Sin V°B° DT"];
  return ["ok","OK"];
}
// ---- estado periódico de cada tipo
function periodico(t){ const H=hoyD(); let ult=null, prox=null;
  if(t.cada){ ult=ultimo(t.k); if(ult){ if(t.cada.habil) prox=nextHabil(ult); else if(t.cada.mes) prox=new Date(ult.getFullYear(),ult.getMonth()+2,0); else prox=addDias(ult,t.cada.dias); } }
  else if(t.k==="P10"){ const r=recsDe("P10"); ult=ultimo("P10");
    const mon2=r.filter(x=>x.interv==="Monitoreo de cebaderas").map(x=>parseF(x.fecha)).filter(Boolean).sort((a,b)=>b-a)[0];
    const des=r.filter(x=>/Desinsect|Fumigación/.test(x.interv||"")).map(x=>parseF(x.fecha)).filter(Boolean).sort((a,b)=>b-a)[0];
    const c=[mon2?addMeses(mon2,2):null, des?addMeses(des,6):null].filter(Boolean).sort((a,b)=>a-b); prox=c[0]||null; }
  else if(t.k==="PROV"){ const c=recsDe("PROV").map(p=>provInfo(p).prox).filter(Boolean).sort((a,b)=>a-b); prox=c[0]||null; ult=ultimo("EVAL"); if(!recsDe("PROV").length) return null; }
  else if(t.k==="EQ"){ const c=equipos().map(e=>eqInfo(e).prox).filter(Boolean).sort((a,b)=>a-b); prox=c[0]||null; ult=ultimo("I12"); if(!equipos().length) return null; }
  else if(t.k==="DOCE"){ const c=recsDe("DOCE").map(d=>parseF(d.ultver)).filter(Boolean).map(d=>addMeses(d,12)).sort((a,b)=>a-b); prox=c[0]||null; ult=ultimo("DOCE","ultver"); if(!recsDe("DOCE").length) return null; }
  else return null;
  let est; if(!ult&&!prox) est=["warn","Sin registros"]; else if(prox&&prox<H) est=["bad","Vencido"];
  else { const umbral=t.cada&&t.cada.habil?0:Math.min(SGCF.aviso, t.cada&&t.cada.dias?t.cada.dias/2:SGCF.aviso); est=prox&&(prox-H)/864e5<=umbral?["warn","Toca "+(prox-H<864e5?"hoy":fCorta(fmt(prox)))]:["ok","Al día"]; }
  return {ult,prox,est};
}
function abiertosDe(t){ return recsDe(t.k).filter(x=>{ const e=estadoSgc(x)[0]; return e==="warn"||e==="bad"||(e==="rev"&&t.evento); }); }

// ---- numeración NN/AA
function proxNumSgc(k, fecha){ const y=(parseF(fecha)||new Date()).getFullYear(); const n=recsDe(k).filter(x=>{ const m=String(x.numero||"").match(/^(\d+)\/(\d{2})$/); return m&&+m[2]===y%100; }).map(x=>+String(x.numero).split("/")[0]);
  return `${pad(Math.max(0,...n)+1)}/${String(y).slice(2)}`; }

      <span class="n">${n}</span><span class="p">${esc(t.nom)}</span><span class="chips"><span class="chip ${chip[0]==="bad"?"warn bad":chip[0]}">${esc(chip[1])}</span></span>

function inputSgc(f, x, edit){
  const [k,l,ty,op]=f; const v=x[k]??"";
  if(!edit){ if(ty==="b") return v?"☒ Sí":"☐"; return esc(v); }
  if(ty==="s") return `<select data-sf="${k}" aria-label="${esc(l)}"><option value=""></option>${op.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  if(ty==="p") return `<select data-sf="${k}" aria-label="${esc(l)}"><option value=""></option>${[...new Set([...SGCF.personas, v].filter(Boolean))].map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  if(ty==="prov") return `<input data-sf="${k}" value="${esc(v)}" list="dl-sgcprov" aria-label="${esc(l)}" class="ph" placeholder="Elegí o escribí">`;
  if(ty==="eq") return `<select data-sf="${k}" aria-label="${esc(l)}"><option value=""></option>${equipos().map(e=>`<option ${e.codigo===v?"selected":""} value="${esc(e.codigo)}">${esc(e.codigo+" · "+(e.clase||""))}</option>`).join("")}</select>`;
  if(ty==="b") return `<input type="checkbox" data-sf="${k}" ${v?"checked":""} aria-label="${esc(l)}" style="width:auto">`;
  if(ty==="ta") return `<textarea data-sf="${k}" aria-label="${esc(l)}" rows="3">${esc(v)}</textarea>`;
  if(ty==="d") return `<input data-sf="${k}" value="${esc(v)}" class="ph" placeholder="dd/mm/aaaa" aria-label="${esc(l)}">`;
  return `<input data-sf="${k}" value="${esc(v)}" ${ty==="n"?'inputmode="decimal"':""} aria-label="${esc(l)}">`;
}

function cuerpoFicha(t, x, edit, campos){
  let h="", par=[];
  const flush=()=>{ if(!par.length) return; h+=`<tr>${par.map(f=>`<td colspan="2" class="b wrapc">${esc(f[1]).toUpperCase()}</td><td colspan="2" class="wrapc">${inputSgc(f,x,edit)}</td>`).join("")}${par.length===1?`<td colspan="4"></td>`:""}</tr>`; par=[]; };
  for(const f of campos){ const [k,l,ty,op,ancho]=f;
    if(ty==="ta"){ flush(); h+=`<tr class="peach"><td colspan="8">${esc(l).toUpperCase()}</td></tr><tr class="obs"><td colspan="8" class="wrapc" style="height:${edit?"auto":"48px"}">${edit?inputSgc(f,x,true):esc(x[k]||"").replace(/\n/g,"<br>")}</td></tr>`; continue; }
    if(ty==="cl"){ flush(); const it=x.chk||{}; op.forEach(([sec,items],si)=>{ h+=`<tr class="peach"><td colspan="5">${esc(sec).toUpperCase()}</td><td class="c">CUMPLE</td><td class="c">NO CUMPLE</td><td></td></tr>`;
        items.forEach((txt,ii)=>{ const key=`${si}.${ii}`, v=it[key]||""; h+=`<tr><td colspan="5" class="wrapc">${esc(txt)}</td>${edit?`<td class="c"><input type="radio" name="cl${key}" data-scl="${key}" value="C" ${v==="C"?"checked":""} style="width:auto" aria-label="Cumple"></td><td class="c"><input type="radio" name="cl${key}" data-scl="${key}" value="N" ${v==="N"?"checked":""} style="width:auto" aria-label="No cumple"></td>`:`<td class="c">${v==="C"?"☒":"☐"}</td><td class="c">${v==="N"?"☒":"☐"}</td>`}<td></td></tr>`; }); });
      if(edit) h+=`<tr><td colspan="8" class="c"><button class="btn small" type="button" data-act="sgcTodoCumple">Marcar todo “Cumple”</button></td></tr>`; continue; }
    if(ty==="ms"){ flush(); const sel_=x[k]||[]; h+=`<tr class="peach"><td colspan="8">${esc(l).toUpperCase()}</td></tr>`;
      for(let i=0;i<op.length;i+=2){ h+=`<tr>${[op[i],op[i+1]].map(o=>o?`<td colspan="4" class="wrapc">${edit?`<label><input type="checkbox" data-sms="${k}" value="${esc(o)}" ${sel_.includes(o)?"checked":""} style="width:auto"> ${esc(o)}</label>`:`${sel_.includes(o)?"☒":"☐"} ${esc(o)}`}</td>`:`<td colspan="4"></td>`).join("")}</tr>`; } continue; }

    par.push(f); if(par.length===2) flush(); }
  flush(); return h; }

const FILAS_HOJA=26;
function enPeriodo(t, x){ const d=parseF(x.fecha||x.fprev||x.fprog); if(t.plan==="mes") return d&&d.getFullYear()===sgcAnio&&d.getMonth()===sgcMes; if(t.plan==="anio") return d&&d.getFullYear()===sgcAnio; return true; }
function hojasTabla(t, code, titulo, periodoTxt, head, rows, anchos, porHoja=FILAS_HOJA){
  const n=head.length; const fc=Math.max(2,Math.floor(n*2/8)), lc=Math.ceil(n*3/8); const cg=`<colgroup>${anchos.map(w=>`<col style="width:${w}%">`).join("")}</colgroup>`;
  const hdr=`<tr class="hdr thick"><td colspan="${lc}"><img src="${LOGO}" alt="Surchérie"></td><td colspan="${n-lc-fc}" class="tit">${esc(titulo)}</td><td colspan="${fc}" class="form">FORM ${esc(code)}<br>REVISIÓN ${esc(t.rev)}</td></tr>`;
  const pags=[]; const tot=Math.max(1,Math.ceil(rows.length/porHoja));
  for(let p=0;p<tot;p++){ const sl=rows.slice(p*porHoja,(p+1)*porHoja); const vac=p===tot-1?Math.max(0,Math.min(porHoja,12)-sl.length):0;
    pags.push(`<div class="paper pl"><table>${cg}${hdr}<tr class="gap"><td colspan="${n}"></td></tr>
     <tr class="thick"><td colspan="${n}" class="b">${esc(periodoTxt)}${tot>1?` · Hoja ${p+1} de ${tot}`:""}</td></tr>
     <tr class="thick peach">${head.map(h=>`<td class="c wrapc">${esc(h)}</td>`).join("")}</tr>
     ${sl.map(r=>`<tr>${r.map(c=>`<td class="wrapc">${esc(c)}</td>`).join("")}</tr>`).join("")}${`<tr>${"<td></td>".repeat(n)}</tr>`.repeat(vac)}
     <tr class="gap"><td colspan="${n}"></td></tr>
     <tr class="foot thick"><td colspan="${Math.ceil(n/2)}">REVISÓ Y MODIFICÓ: ${esc(SGCF.reviso).toUpperCase()}<br>APROBÓ: ${esc(SGCF.aprobo).toUpperCase()}</td><td colspan="${Math.floor(n/2)}">FIRMA DIRECTOR TÉCNICO:<br>FECHA: ${esc(hoy())}</td></tr></table></div>`); }
  return pags; }
function planillaTemp(t){
  const dias=new Date(sgcAnio,sgcMes+1,0).getDate(); const recs=recsDe("T11").filter(x=>enPeriodo(t,x)); const rows=[]; const desv=[];
  for(let d=1;d<=dias;d++){ const f=`${pad(d)}/${pad(sgcMes+1)}/${sgcAnio}`; const fd=new Date(sgcAnio,sgcMes,d); if(fd.getDay()===0||fd.getDay()===6) continue;
    const de=recs.filter(x=>{ const p=parseF(x.fecha); return p&&p.getDate()===d; }); const m=de.find(x=>/Mañana/.test(x.turno)), ta=de.find(x=>/Tarde/.test(x.turno));
    const c=x=>x?[x.rango==="Sí"?"☒":"☐", x.rango==="No"?"☒":"☐", x.rango==="No"?`${x.t??""}° / ${x.hr??""}%`:"", (x.reg||"").split(" ")[0]+(x.vb?" ✓":"")]:["","","",""];
    rows.push([String(d), ...c(m), ...c(ta)]); de.filter(x=>x.rango==="No").forEach(x=>desv.push(x)); }
  const pags=hojasTabla(t,t.code,t.tit,`MES: ${MESES[sgcMes].toUpperCase()} ${sgcAnio}  ·  Rango: ${SGCF.tmin}–${SGCF.tmax} °C, ${SGCF.hmin}–${SGCF.hmax} % HR  ·  MAÑANA 8:00 | TARDE 15:30`,
    ["Día","M: en rango","M: desvío","M: T / HR","M: firma","T: en rango","T: desvío","T: T / HR","T: firma"], rows, [7,10,10,13,12,10,10,13,15]);
  if(desv.length) pags.push(...hojasTabla(t,t.code,"REGISTRO DE DESVÍOS DE TEMPERATURA Y HUMEDAD",`MES: ${MESES[sgcMes].toUpperCase()} ${sgcAnio}`,["Fecha","Turno","T (°C)","HR (%)","Acción adoptada","N° POE-08","Firma"],
    desv.map(x=>[x.fecha,x.turno,String(x.t??""),String(x.hr??""),x.accion||"",x.nc||"",x.reg||""]),[12,12,9,9,34,10,14]));
  return pags; }

         r.map(x=>[x.fecha,x.interv||"",x.desc||"",x.resultado||"",x.realizo||"",x.vb?"✓":""]),[11,19,36,10,14,10])); }); return pags; }
   case "NC": return hojasTabla(t,t.code2,t.tit2,anio,["N° informe","Fecha","Producto","Lote","Proveedor","Tipo de NC","Disposición","Fecha cierre"],
       recsDe("NC").filter(x=>enPeriodo(t,x)).map(x=>[x.numero||"",x.fecha,x.producto||"",x.lote||"",x.prov||"",x.clasif||"",x.dispo||"",x.cierre||""]),[9,10,20,10,13,15,13,10]);
   case "BAJ": return hojasTabla(t,t.code,t.tit,anio,["Fecha","Producto","Marca","Lote","Vto.","Cant.","Motivo","Destino","Remito dev.","Baja kardex"],
       recsDe("BAJ").filter(x=>enPeriodo(t,x)).map(x=>[x.fecha,x.producto||"",x.marca||"",x.lote||"",x.vto||"",x.cant||"",x.motivo||"",x.destino||"",x.remdev||"",x.fkardex||""]),[9,20,10,9,8,6,11,11,8,8]);
   case "AC": return hojasTabla(t,t.code,t.tit,anio,["N°","Fecha","Origen","Ref.","Hallazgo","Acción","Responsable","Plazo","Verificación","Estado"],
       recsDe("AC").filter(x=>enPeriodo(t,x)).map(x=>[x.numero||"",x.fecha,x.origen||"",x.ref||"",x.hallazgo||"",x.accion||"",x.resp||"",x.plazo||"",x.eficacia||"",estadoSgc(x)[1]]),[6,9,11,6,18,18,10,8,8,6],14);
   case "CAP": return hojasTabla(t,t.code,t.tit,anio,["Fecha","Tema","Procedimientos","Capacitador","Asistentes","Horas","Evaluación"],
       recsDe("CAP").filter(x=>enPeriodo(t,x)).map(x=>[x.fecha,x.tema||"",x.procs||"",x.capacitador||"",x.asistentes||"",String(x.duracion||""),x.evaluacion||""]),[10,22,12,14,26,6,10]);
   case "REV": return hojasTabla(t,t.code2,t.tit2,"Frecuencia mínima anual",["Año","Fecha programada","Fecha realizada","Observaciones"],
       recsDe("REV").map(x=>[(parseF(x.fprog||x.fecha)||new Date()).getFullYear()+"",x.fprog||"",x.fecha||"",x.conclusion||""]),[15,25,25,35]);
   case "AUD": return hojasTabla(t,t.code3,t.tit3,"La auditoría interna se realiza con frecuencia mínima anual. Toda modificación se justifica en Observaciones.",["Año","Mes programado","Fecha realizada","Observaciones"],
       recsDe("AUD").map(x=>[(parseF(x.fprev||x.fecha)||new Date()).getFullYear()+"",x.mesProg||"",x.fecha||"",x.conclusion||""]),[15,25,25,35]);
   case "PROV": return hojasTabla(t,t.code,t.tit,`Fecha de emisión: ${hoy()}`,["Código","Proveedor","Tipo","Hab. vigente","Cert. PM","Categoría","Últ. evaluación","Próx. revisión","Obs."],
       recsDe("PROV").map(p=>{ const i=provInfo(p); return [p.codigo||"",p.nombre||"",p.clase||"",p.vtoHab&&parseF(p.vtoHab)>=hoyD()?"Sí":p.vtoHab?"No":"",i.ev?i.ev.pm||"":"",i.cat||"Sin evaluar",i.ev?i.ev.fecha:"",i.prox?fmt(i.prox):"",p.obs||""]; }),[9,18,10,8,7,13,11,11,13]);
   case "EQ": return hojasTabla(t,t.code,t.tit,`Fecha de emisión: ${hoy()}`,["Código","Tipo","Marca / modelo","N° serie","Ubicación","Tarjeta 12-03","Calificación","Estado"],
       equipos().map(e=>[e.codigo,e.clase||"",e.marca||"",e.serie||"",e.ubic||"",e.tarjeta||"",e.calif||"",e.estado||""]),[9,16,16,12,11,10,11,15]);
   case "DOCI": return hojasTabla(t,t.code,t.tit,`Fecha de emisión: ${hoy()}`,["N°","Código","Título del documento","Tipo","Revisión","Emisión","Estado","Ubicación"],
       recsDe("DOCI").sort((a,b)=>String(a.codigo).localeCompare(String(b.codigo))).map((d,i)=>[String(i+1),d.codigo||"",d.titulo||"",d.clase||"",d.rev||"",d.femision||"",d.estado||"",d.ubic||""]),[5,10,33,7,8,10,10,17]);

       recsDe("DOCE").map((d,i)=>[String(i+1),d.doc||"",d.emisor||"",d.version||"",d.aplic||"",d.ubic||"",d.estado||"",d.ultver||""]),[5,28,10,8,20,11,8,10]);
   case "MAE": return hojasTabla(t,t.code,t.tit,`Fecha de emisión: ${hoy()}`,["Código","Registro","Proc.","Frecuencia","Completa / verifica","Soporte","Conservación"],
       filasMaestro().map(r=>[r[0],r[1],r[2],r[3],r[4],r[5],r[6]]),[13,21,9,17,16,12,12],15);
  }
  return [];
}

// ---------------- PDF de varias hojas ----------------
async function pdfHojas(htmls, opt={}){
  const pdf=new jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait"}); const host=document.getElementById("offscreen");
  for(let i=0;i<htmls.length;i++){ host.innerHTML=htmls[i]; const el=host.firstElementChild;
    await Promise.all([...el.querySelectorAll("img")].map(im=>im.complete?0:new Promise(ok=>im.onload=im.onerror=ok)));
    const canvas=await html2canvas(el,{scale:2.5,backgroundColor:"#ffffff"}); let w=210,h=canvas.height*w/canvas.width; if(h>297){ h=297; w=canvas.width*h/canvas.height; }
    if(i) pdf.addPage(); pdf.addImage(canvas.toDataURL("image/jpeg",0.92),"JPEG",(210-w)/2,0,w,h); }
  host.innerHTML=""; if(opt.imprimir) pdf.autoPrint(); return pdf.output("blob"); }
function nombreSgc(t,x){ return limpiaNombre(`${t.code} ${t.nom}${x?" "+(x.numero?x.numero.replace("/","-")+" ":"")+(x.fecha||x.fprev||x.nombre||x.codigo||"").replace(/\//g,"-"):""}`); }
function nombrePlanilla(t){ return limpiaNombre(`${t.plan==="lista"||t.virtual?t.code:t.code2||t.code} ${t.nom} ${t.plan==="mes"?MESES[sgcMes]+" "+sgcAnio:t.plan==="anio"?sgcAnio:hoy().replace(/\//g,"-")}`); }
function hojasDeRegistro(t,x){ return t.k==="AUD"?[fichaSgc(t,x,false,1),fichaSgc(t,x,false,2)]:[fichaSgc(t,x,false)]; }

// ---------------- guardado ----------------
function guardarSgc(id, inmediato){ guardar("sgc", id, inmediato); }
function nuevoSgc(k, base={}){
  const t=TIPO.get(k); const id="s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); const x={tipo:k, creado:hoy(), ...base};
  if(!t.maestro&&!("fecha" in x)&&t.f.some(f=>f[0]==="fecha")&&!["REV","AUD"].includes(k)) x.fecha=hoy();
  const yo=sgcYo(); t.f.forEach(f=>{ if(f[2]==="p"&&["reg","recibio"].includes(f[0])&&yo&&!x[f[0]]) x[f[0]]=yo; });
  if(t.num) x.numero=proxNumSgc(k, x.fecha);
  if(k==="T11"&&!x.turno) x.turno=new Date().getHours()<12?"Mañana 8:00":"Tarde 15:30";
  if(k==="C09"||k==="H09"){ const d=new Date(); x.mes=`${MESES[d.getMonth()]} ${d.getFullYear()}`; x.chk={}; }
  DATA.sgc.set(id,{...x,_id:id}); ORDER.sgc.unshift(id); return id; }

Object.assign(acciones,{

    const turno=e.target.dataset.turno||(new Date().getHours()<12?"Mañana 8:00":"Tarde 15:30"); const ya=recsDe("T11").find(x=>x.fecha===hoy()&&x.turno===turno&&!x.anulado);
    let id; if(ya){ id=ya._id; ya.rango=ok; } else id=nuevoSgc("T11",{rango:ok,turno}); await guardarSgc(id,true); if(ok==="No"){ mod="sgc"; sel.sgc="T11"; sgcRec=id; sgcPanel=null; render(); } else { render(); aviso(`Registrado: ${hoy()} ${turno}, en rango.`,"ok"); } },
  sgcVolver(){ sgcRec=null; sgcPanel=null; render(); },
  sgcConfig(){ sgcPanel="config"; renderMain(); },

    try{ await db.doc("meta/sgc").set(n); SGCF=n; }catch(err){ return aviso("No se pudo guardar: "+(err.message||err.code)); } sgcPanel=null; render(); aviso("Configuración guardada.","ok"); },
  async sgcBorrar(e){ const b=e.target; const t=TIPO.get(sel.sgc); const x=DATA.sgc.get(sgcRec);
    if(b.dataset.ok!=="1"){ b.dataset.ok="1"; b.textContent="Tocá de nuevo para confirmar"; setTimeout(()=>{ if(b.isConnected){ b.dataset.ok=""; b.textContent=t.maestro?"Quitar":"Anular"; } },4000); return; }

    else { x.anulado=hoy()+(sgcYo()?" · "+sgcYo():""); await guardarSgc(sgcRec,true); }

  sgcTodoCumple(){ const x=DATA.sgc.get(sgcRec); const t=TIPO.get(x.tipo); const sec=t.k==="C09"?C09:H09; x.chk=x.chk||{}; sec.forEach((s,si)=>s[1].forEach((_,ii)=>{ if(!x.chk[`${si}.${ii}`]) x.chk[`${si}.${ii}`]="C"; })); guardarSgc(sgcRec,true); renderMain(); renderList(); },
  async sgcDelKardex(){ const x=DATA.sgc.get(sgcRec); if(!ORDER.stk.length) return aviso("Primero leé el kardex (Stock › Actualizar desde kardex).");
    const H=new Date(), lim=new Date(); lim.setMonth(lim.getMonth()+6); let v=0,p=0; DATA.stk.forEach(k=>Object.values(k.lotes||{}).forEach(l=>{ if(l.disp>0&&l.vtoD){ const d=new Date(l.vtoD); if(d<H) v+=l.disp; else if(d<lim) p+=l.disp; } }));
    x.venc=String(v); x.prox=String(p); await guardarSgc(sgcRec,true); renderMain(); renderList(); aviso(`Del kardex: ${v} unidades vencidas y ${p} que vencen en 6 meses. Completá diferencias, FEFO y envases después de mirar la estantería.`,"ok"); },

    sel.sgc="AC"; sgcRec=id; render(); aviso(`Acción ${DATA.sgc.get(id).numero} creada desde el reclamo ${x.numero}.`,"ok"); },
  async sgcPlanilla(e){ const t=TIPO.get(sel.sgc); const b=e.target.closest("button"); const tx=b.textContent; b.disabled=true; b.textContent="Generando…";
    try{ const hojas=planillaSgc(t); const blob=await pdfHojas(hojas); const nom=nombrePlanilla(t)+".pdf";

    try{ const blob=await pdfHojas(x?hojasDeRegistro(t,x):planillaSgc(t),{imprimir:true}); await imprimirPDF(blob, "Imprimir - "+(x?nombreSgc(t,x):nombrePlanilla(t))+".pdf"); }

function refrescarChipSgc(x){ const c=document.getElementById("chipSgc"); if(c){ const e=estadoSgc(x); c.className="chip "+(e[0]==="bad"?"warn bad":e[0]); c.textContent=e[1]; } }
main.addEventListener("input", e => { if(mod!=="sgc") return; const el=e.target;
  if(el.matches("[data-sf]")&&el.type!=="checkbox"&&el.tagName!=="SELECT"){ const x=DATA.sgc.get(sgcRec); if(!x) return; x[el.dataset.sf]=el.value; refrescarChipSgc(x); guardarSgc(sgcRec); } });
main.addEventListener("change", async e => { if(mod!=="sgc") return; const el=e.target;
  if(el.matches("[data-yo]")){ setYo(el.value); return; }
  if(el.matches("[data-smes]")){ sgcMes=+el.value; return; }
  if(el.matches("[data-sanio]")){ sgcAnio=+el.value||new Date().getFullYear(); return; }
  if(el.matches("[data-scfg]")) return;
  const x=DATA.sgc.get(sgcRec); if(!x) return;
  if(el.matches("[data-svb]")){ x.vb=el.checked; x.vbFecha=el.checked?hoy():""; x.vbPor=el.checked?sgcYo():""; await guardarSgc(sgcRec,true); renderMain(); renderList(); return; }
  if(el.matches("[data-scl]")){ x.chk=x.chk||{}; x.chk[el.dataset.scl]=el.value; guardarSgc(sgcRec); refrescarChipSgc(x); return; }
  if(el.matches("[data-sms]")){ const k=el.dataset.sms; x[k]=[...main.querySelectorAll(`[data-sms="${k}"]:checked`)].map(c=>c.value); guardarSgc(sgcRec); return; }
  if(el.matches("[data-sf]")){ const k=el.dataset.sf; x[k]=el.type==="checkbox"?el.checked:el.value;
    if(k==="fecha"&&x.numero&&TIPO.get(x.tipo).num){ const y=parseF(el.value); if(y&&!String(x.numero).endsWith("/"+String(y.getFullYear()).slice(2))) x.numero=proxNumSgc(x.tipo, el.value); }
    if(x.tipo==="PROV"&&k==="nombre") document.getElementById("dl-sgcprov").innerHTML=provNombres().map(p=>`<option value="${esc(p)}"></option>`).join("");

  ORDER.rcc.forEach(id=>{ const r=DATA.rcc.get(id); const d=parseF(r.fecha); if(!d) return;
    const e=+d===+H?["fut","Hoy"]:d>H?["fut","Programada"]:estado(r);

    vistos.add(key(r.rcc,r.fecha,r.paciente)); vistos.add(key("",r.fecha,r.paciente)); });
  (AGENDA.rows||[]).forEach(a=>{ const d=parseF(a.fecha); if(!d) return; if(vistos.has(key(a.rcc,a.fecha,a.paciente))||vistos.has(key("",a.fecha,a.paciente))) return;
