       return `<label class="frow"><input type="checkbox" data-firma="${x._id}" ${inc?"":"checked"}><span class="fecha">${esc(fCorta(x.fecha||""))}</span><span class="t">${esc(resumenSgc(x)||"—")}<span>${esc(x.reg||x.realizo||x.recibio||"")}</span></span><span class="chip ${e2[0]==="bad"?"warn bad":e2[0]}">${esc(e2[1])}</span><button type="button" class="btn small" data-go="sgc:${k}:${x._id}">Ver</button></label>`; }).join("")}</section>`; }).join(""):`<section class="card"><p class="hint">No hay nada para firmar.</p></section>`}</div>`;

// ---- agenda desde Seguimiento de cirugías
async function traerAgenda(btn){
  if(!mcp) return aviso("Esta página no tiene acceso a Google Sheets. Conectá Google Sheets para traer la agenda.");
  const tx=btn.textContent; btn.disabled=true; btn.textContent="Leyendo…";
  try{ const p=await gs("get_values",{spreadsheetId:SEG_ID, range:"Cirugias!A2:H"}); const vals=p.values||p.valueRange?.values||[];
    const desde=addDias(hoyD(),-120); const rows=[];
    vals.forEach(v=>{ const f=String(v[1]||"").trim(); const d=parseF(f); if(!d||d<desde) return; rows.push({rcc:String(v[0]||"").trim(), fecha:fmt(d), medico:String(v[2]||"").trim(), paciente:String(v[3]||"").trim(), inst:String(v[4]||"").trim(), cir:String(v[5]||"").trim(), remito:String(v[7]||"").trim()}); });
    if(!rows.length) throw new Error("no encontré cirugías con fecha en la pestaña Cirugias");
    const n={rows, leido:hoy()+" "+pad(new Date().getHours())+":"+pad(new Date().getMinutes()), por:sgcYo()};
    await db.doc("meta/agenda").set(n); AGENDA=n; renderMain();
    const fut=rows.filter(r=>parseF(r.fecha)>=hoyD()).length; aviso(`Agenda actualizada: ${rows.length} cirugías leídas, ${fut} programadas desde hoy.`,"ok"); }
  catch(err){ aviso("No pude leer la planilla de seguimiento: "+(err.message||err.code||err)); }
  finally{ if(btn.isConnected){ btn.disabled=false; btn.textContent=tx; } } }

// ---- Calidad: resumen en tarjetas
function renderSgcResumen(){
  const main=document.getElementById("main"); let b="", h="";
  const firm=sinFirma().length;
  for(const t of TIPOS){ if(t.b!==b){ if(b) h+=`</div>`; b=t.b; h+=`<h3 class="bloque">${esc(b)}</h3><div class="tiles">`; }
    const per=periodico(t), ab=t.virtual?[]:abiertosDe(t), n=t.virtual?"":recsDe(t.k).length;
    let e=t.maestro&&!recsDe(t.k).length?["warn","Sin cargar"]:per?per.est:ab.length?[ab.some(x=>estadoSgc(x)[0]==="bad")?"bad":"warn",`${ab.length} pendiente${ab.length>1?"s":""}`]:["ok",t.virtual?"Automático":"Al día"];
    h+=`<button class="tile ${e[0]==="mute"?"ok":e[0]}" data-go="sgc:${t.k}"><span class="tc">${esc(t.code)}</span><b>${esc(t.nom)}</b><span class="te"><span class="dot ${e[0]==="rev"?"rev":e[0]}"></span>${esc(e[1])}</span><span class="tn">${n!==""?n+" reg.":""}${per&&per.prox?` · próx. ${fCorta(fmt(per.prox))}`:""}</span></button>`; }
  h+=`</div>`;
  const perT=TIPOS.map(t=>periodico(t)).filter(Boolean), okT=perT.filter(p=>p.est[0]==="ok").length, pc=perT.length?Math.round(100*okT/perT.length):100;
  main.innerHTML=`<div class="hoy"><div class="hero"><div><p class="fecha">Registros del Manual de Calidad 2026 · cumplimiento de controles ${pc} % (${okT} de ${perT.length})</p></div>
    <div class="grp0">${firm?`<button class="btn primary" data-act="hoyFirmar">Firma en lote (${firm})</button>`:""}<button class="btn" data-go="sgc:MAE">Listado PG-05-01</button></div></div><section class="card">${h}</section></div>`;
}

    const add=(c,id,d)=>{ if(d==null) return; if(ya.has(c+"/"+id)){ repetidos++; return; } const j=JSON.stringify(d); if(j.length>49000){ grandes.push(c+"/"+id); return; } filas.push([c,id,j,ts,"migración app Claude",""]); };
    for(const m of Object.keys(COL)) for(const id of DATA[m].keys()) add(COL[m], id, limpiar(DATA[m].get(id)));

    for(let i=0;i<filas.length;i+=150){ b.textContent=`Copiando ${Math.min(i+150,filas.length)} de ${filas.length}…`; await gs("append_values",{spreadsheetId:REG_ID, range:"AppDB!A1", values:filas.slice(i,i+150)}); }
    aviso(`Listo: ${filas.length} registros copiados a la app web${repetidos?`, ${repetidos} ya estaban (no se tocaron)`:""}${grandes.length?`. No entraron por tamaño: ${grandes.join(", ")}`:""}.`,"ok");
  }catch(err){ aviso("No se pudo copiar: "+errTxt(err)+(String(err&&err.message||"").includes("AppDB")?" (falta la pestaña AppDB en la planilla Surchérie Registros)":"")); }

// ---------------- arranque ----------------
(async () => {
  const dl=document.createElement("datalist"); dl.id="dl-sist"; dl.innerHTML=SIST.map(s=>`<option value="${esc(s[0])}">${esc(s[1].slice(0,60))}</option>`).join(""); document.body.appendChild(dl);
  downloads=await claude.use("downloads");
  claude.use("mcp").then(m=>{ mcp=m; });
  db=await claude.use("db");
  const loading=document.getElementById("loading");
  if(!db){ loading.textContent="No se pudo abrir la base de datos. Abrí esta página desde claude.ai con tu cuenta."; return; }
  const timer=setTimeout(()=>{ if(loading.isConnected) loading.textContent="La base tarda en responder. Si sigue así, revisá la conexión."; },10000);
  const sortBy={rec:(a,b)=>String(b).localeCompare(String(a)), stk:(a,b)=>((DATA.stk.get(a).prov||"")+DATA.stk.get(a).desc).localeCompare((DATA.stk.get(b).prov||"")+DATA.stk.get(b).desc), rcc:(a,b)=>(DATA.rcc.get(a).orden||1e9)-(DATA.rcc.get(b).orden||1e9), rem:(a,b)=>(+DATA.rem.get(b).numero||0)-(+DATA.rem.get(a).numero||0), oc:(a,b)=>(+DATA.oc.get(b).numero||0)-(+DATA.oc.get(a).numero||0), sgc:(a,b)=>{ const x=DATA.sgc.get(a), y=DATA.sgc.get(b); const fx=parseF(x.fecha||x.fprev||x.fprog), fy=parseF(y.fecha||y.fprev||y.fprog); if(fx&&fy&&+fx!==+fy) return fy-fx; if(!fx!==!fy) return fx?1:-1; return String(x.codigo||x.nombre||x.doc||x.creado||"").localeCompare(String(y.codigo||y.nombre||y.doc||y.creado||""))||String(b).localeCompare(String(a)); }};
  let primera=true;
  db.doc("meta/carpetas").onSnapshot(s=>{ CARP=s.exists?s.data():{}; renderActions(); }, ()=>{});
  db.doc("meta/agenda").onSnapshot(s=>{ if(s.exists){ AGENDA={rows:[],...s.data()}; if(mod==="hoy"&&!hoyPanel) renderMain(); } }, ()=>{});
  db.doc("meta/sgc").onSnapshot(s=>{ if(s.exists){ SGCF={...SGCF,...s.data()}; if(mod==="sgc"&&!document.querySelector(".paper :focus")&&!sgcPanel) renderMain(); } }, ()=>{});
  db.doc("meta/kardex").onSnapshot(s=>{ if(s.exists){ DATA.meta=s.data(); if(mod==="stk"||mod==="pen") renderStats(); } }, ()=>{});
  ["rcc","rem","oc","rec","stk","sgc"].forEach(m => {
    db.collection(COL[m]).onSnapshot(snap => {
      if(!snap.metadata.fromCache) clearTimeout(timer);
      const editing=document.querySelector(".paper :focus");
      snap.docs.forEach(d => { if(pending.has(m+":"+d.id)) return; DATA[m].set(d.id,{...JSON.parse(JSON.stringify(d.data())),_id:d.id}); });
      const ids=new Set(snap.docs.map(d=>d.id)); [...DATA[m].keys()].forEach(k=>{ if(!ids.has(k)&&!pending.has(m+":"+k)) DATA[m].delete(k); });
      ORDER[m]=[...DATA[m].keys()].sort(sortBy[m]);
      if(m==="sgc") document.getElementById("dl-sgcprov").innerHTML=provNombres().map(p=>`<option value="${esc(p)}"></option>`).join("");
      if(m!=="sgc"&&(!sel[m]||!DATA[m].has(sel[m]))) sel[m]=m==="rcc"?(ORDER.rcc.find(id=>estado(DATA.rcc.get(id))[0]!=="ok")||ORDER.rcc[0]):ORDER[m][0]||null;
      if(primera&&m==="rcc"){ primera=false; render(); return; }
      if(m===mod||mod==="pen"||(mod==="hoy"&&!hoyPanel)){ renderList(); if(!editing&&!panel) renderMain(); } else badges();
    }, err => { clearTimeout(timer); loading.textContent="No se pudieron leer los datos: "+(err.message||err.code); });
  });
})();
